mode: "flight_testing"
debug: true
targets: ["bus", "car", "person", "ski"]
number_of_targets: 4
num_photos: 28
valid_targets: [
  "person", "car", "motorcycle", "airplane", "bus", "bus", 
  "boat", "stop_sign", "snowboard", "umbrella", "sports_ball", 
  "baseball_bat", "bed", "tennis_racket", "suitcase", "skis" 
]
flight_testing:
  flight_testing_dir: "flight_testing"
logging: false
runtime_history_dir: "runtime"
runtime_folder_override: "odcl_demo"
watch_directory: "synthetic_images/dest"
waypoint_file_path: "waypoints.txt"
airdrop:
  boundary:
    bound_1: [21.400355, -157.764440]
    bound_2: [21.400551, -157.763874]
    bound_3: [21.400778, -157.763964]
    bound_4: [21.400607, -157.764499]
  flight_testing:
    option_1: [21.40096,-157.76345]
    option_2: [21.40096,-157.76495]
    option_3: [21.40024,-157.76345]
    option_4: [21.40024, -157.76495]
  competition:
    option_1: [99,99]
    option_2: [99,99]
    option_3: [99,99]
    option_4: [99,99]
  manual:
    option_1: [99,99]
    option_2: [99,99]
    option_3: [99,99]
    option_4: [99,99]

camera:
  load_config: true
  load_ext_config: true
  ext_config: "config/camera.json"
  sensor_height: 15.6 # mm
  sensor_width: 23.55 # mm
  config:
    iso: 2
    whitebalance: 10
    exposurecompensation: 10
    f-number: 8
    shutterspeed: 10
    d01c: 
    d170: 
object_detection:
  model: "weight/v9.pt"
  model_type: 'yolov8'
  confidence_threshold: 0.25
  device: "mpss"
  sahi:
    slice: false
    slice_height: 640
    slice_width: 640
    overlap_height_ratio: 0.11
    overlap_width_ratio: 0.11
    perform_standard_pred: true
    postprocess_match_metric: "IOU"
    postprocess_match_threshold: 0.3
  sahi-single-prediction-postprocess:
    options: [
      "None",                   #0
      "GreedyNMMPostprocess",   #1
      "LSNMSPostprocess",       #2
      "NMMPostprocess",         #3
      "NMSPostprocess",         #4
      "PostprocessPredictions", #5
    ]
    choice: 3
    match_threshold: 0.2
    match_metric: "IOU"
    class_agnostic: true 
georeferencing:
  duplicate_threshold: 3
  altitude_offset: 0

